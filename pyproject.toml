[project]
name = "echoink"
version = "1.0.0"
description = "Voice dictation app — speak and your words appear instantly in any window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MohammadNuramin" }
]
keywords = ["voice", "dictation", "whisper", "speech-to-text", "bangla", "linux", "windows", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "PyQt6>=6.4.0",
    "pyaudio>=0.2.13",
    "numpy>=1.24.0",
    "sherpa-onnx==1.13.8",
    "onnx-asr>=0.11.0,<0.12",
    "huggingface-hub>=0.27.0",
    "filelock>=3.0",
    "pynput>=1.7.6",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
# Bangla speech and English/Bangla detection run through ONNX Runtime; install ONE of:
#   pip install -e ".[gpu]"   NVIDIA GPU (CUDA 12 / cuDNN 9 wheels, no CUDA Toolkit needed)
#   pip install -e ".[cpu]"   CPU only
# Orukeet (English) uses sherpa-onnx on the CPU and needs neither.
gpu = [
    "onnxruntime-gpu>=1.20.0",
    "nvidia-cudnn-cu12>=9,<10",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
]
cpu = [
    "onnxruntime>=1.20.0",
]
windows = [
    "pyperclip>=1.8.0",
]
linux = [
    "evdev>=1.6.0",
]
wayland = [
    "dbus-python>=1.3.0",
    "PyGObject>=3.42.0",
    "evdev>=1.6.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.gui-scripts]
echoink = "echoink._entry:main"

[project.urls]
Homepage = "https://github.com/MohammadNuramin/echoink"
Repository = "https://github.com/MohammadNuramin/echoink"
Issues = "https://github.com/MohammadNuramin/echoink/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echoink"]

[tool.uv]
# onnxruntime and onnxruntime-gpu provide the same module; only one can be installed.
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/echoink/icons.py" = ["E501"]  # SVG strings are naturally long
